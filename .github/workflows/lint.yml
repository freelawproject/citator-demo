name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5

      - uses: pre-commit/action@v3.0.1

      - name: Install Python deps
        run: uv sync --group dev

      - name: mypy
        run: uv run mypy
