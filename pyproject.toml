[project]
name = "citator-demo"
version = "0.0.1"
description = "Static demo site for the Free Law Project citator. Build script transforms inference outputs into per-opinion JSON consumed by Eleventy."
authors = [{ name = "Free Law Project", email = "info@free.law" }]
requires-python = ">=3.13"
readme = "README.md"
license = "BSD-2-Clause"

dependencies = [
    "pandas>=2.0",
]

urls.Repository = "https://github.com/freelawproject/citator-demo"
urls."Organisation Homepage" = "https://free.law/"

[tool.ruff]
line-length = 79
lint.extend-safe-fixes = [
  "UP006",
]
lint.select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "SIM",
  "TID",
  "UP",
  "W",
]
lint.ignore = [
  "B9",
  "E501",
  "SIM105",
  "SIM108",
  "UP031",
]
