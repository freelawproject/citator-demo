name: Build check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Node deps
        run: npm ci

      - name: Install Python deps
        run: uv sync --group dev

      - name: Run Python tests
        run: uv run pytest

      # The real data is not in the repo; the fixtures exercise every
      # template and the full data → CSS → Eleventy chain.
      - name: Build the site from the fixtures
        run: npm run build
        env:
          CITATOR_DEMO_DATA: mock

      - name: Verify the output
        run: |
          test -f _site/index.html
          test -f _site/about/index.html
          test -f _site/assets/css/styles.css
          test -f _site/assets/js/alpine.min.js
          pages=$(find _site/opinion -name index.html | wc -l)
          echo "opinion pages: $pages"
          test "$pages" -eq 10
